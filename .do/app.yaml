# DigitalOcean App Platform specification
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Deploy: Connect this repo to App Platform via the DigitalOcean control panel.
# The app auto-deploys on every push to main.
#
# Required environment variables (set in DO dashboard, not here):
#   SUPABASE_URL
#   SUPABASE_SECRET_KEY
#   AWS_SES_REGION          (e.g. us-east-1 or ap-south-1)
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   REPORT_FROM_EMAIL       (e.g. Stock Agent <reports@yourdomain.com>)
#   PUBLIC_API_BASE_URL     (the app's live URL, e.g. https://stock-agent-xxxxx.ondigitalocean.app)
#   DISPATCH_SECRET         (shared with GitHub Actions)

name: stock-agent-api
region: tor  # Toronto — closest to your Supabase in ca-central-1
services:
  - name: api
    github:
      repo: tridibbanik17/Stock_Agent
      branch: main
      deploy_on_push: true
    source_dir: /backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-512mb-10gb  # $5/month (Starter)
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DISPATCH_EARLY_MINUTES
        value: "20"
      - key: DISPATCH_LATE_MINUTES
        value: "120"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_SUBSCRIBE_PER_MIN
        value: "10"
      - key: RATE_LIMIT_SNAPSHOT_PER_MIN
        value: "30"
