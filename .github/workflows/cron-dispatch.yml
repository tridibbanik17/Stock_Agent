# DEPRECATED: Dispatch is now handled by AWS EventBridge + Lambda (every 5 min, punctual).
# This workflow is disabled. Delete GitHub Actions secrets PUBLIC_API_BASE_URL and DISPATCH_SECRET.
#
# To re-enable, uncomment the schedule trigger below.
name: Scheduled report dispatch (disabled)

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping dispatch-due
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_API_BASE_URL:-}" ]; then
            echo "::error::Missing secret PUBLIC_API_BASE_URL (Render HTTPS origin, no trailing slash)."
            exit 1
          fi
          if [ -z "${DISPATCH_SECRET:-}" ]; then
            echo "::error::Missing secret DISPATCH_SECRET (must match Render DISPATCH_SECRET)."
            exit 1
          fi
          BASE="${PUBLIC_API_BASE_URL%/}"
          URL="${BASE}/api/internal/dispatch-due"
          echo "POST ${URL}"
          # Show body on failure (curl -f → exit 22 hides the JSON otherwise)
          set +e
          HTTP_CODE=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/dispatch-due.json -w "%{http_code}" \
            -X POST "${URL}" \
            -H "X-Dispatch-Secret: ${DISPATCH_SECRET}" \
            -H "Accept: application/json")
          CURL_EXIT=$?
          set -e
          echo "HTTP ${HTTP_CODE} (curl_exit=${CURL_EXIT})"
          if [ -f /tmp/dispatch-due.json ]; then
            echo "Response body:"
            cat /tmp/dispatch-due.json
            echo
          fi
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::dispatch-due failed. If HTTP 503 mentions DISPATCH_SECRET, set it on Render Environment (same value as this Actions secret) and redeploy."
            exit 1
          fi
          echo "dispatch-due OK"
