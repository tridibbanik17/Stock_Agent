# Hybrid B wake-up: ping the hosted API every 5 minutes.
# The API runs early/overdue matching + Resend (see POST /api/internal/dispatch-due).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PUBLIC_API_BASE_URL   e.g. https://stock-agent-api-m06f.onrender.com  (no trailing slash)
#   DISPATCH_SECRET       same value as Render env DISPATCH_SECRET
#
# Supabase / Resend secrets are no longer needed here — they live on Render.
name: Scheduled report dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping dispatch-due
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_API_BASE_URL:-}" ]; then
            echo "::error::Missing secret PUBLIC_API_BASE_URL (Render HTTPS origin, no trailing slash)."
            exit 1
          fi
          if [ -z "${DISPATCH_SECRET:-}" ]; then
            echo "::error::Missing secret DISPATCH_SECRET (must match Render DISPATCH_SECRET)."
            exit 1
          fi
          BASE="${PUBLIC_API_BASE_URL%/}"
          echo "POST ${BASE}/api/internal/dispatch-due"
          # -f fails on HTTP 4xx/5xx; --retry helps free-tier cold starts
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "${BASE}/api/internal/dispatch-due" \
            -H "X-Dispatch-Secret: ${DISPATCH_SECRET}" \
            -H "Accept: application/json" \
            -w "\nHTTP %{http_code}\n"
