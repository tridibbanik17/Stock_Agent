# Render Blueprint — hosted Stock Agent FastAPI
# https://render.com/docs/blueprint-spec
#
# After first deploy, copy the service URL into:
#   - extension/lib/config.js → PROD_API_BASE
#   - GitHub Actions secret PUBLIC_API_BASE_URL
#   - Render env PUBLIC_API_BASE_URL (same URL)

services:
  - type: web
    name: stock-agent-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_FROM_EMAIL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: DISPATCH_SECRET
        sync: false
      - key: DISPATCH_EARLY_MINUTES
        value: "10"
      - key: DISPATCH_LATE_MINUTES
        value: "120"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_SUBSCRIBE_PER_MIN
        value: "10"
      - key: RATE_LIMIT_SNAPSHOT_PER_MIN
        value: "30"
